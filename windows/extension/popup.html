<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>body{width:330px;padding:14px}h1{font-size:16px;margin:0 0 2px;display:flex;align-items:center;gap:8px}h1 img{width:20px;height:20px}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
.seg{display:flex;background:var(--bg);border-radius:9px;padding:3px;margin:10px 0;border:1px solid var(--bd)}.seg button{flex:1;border:0;background:none;padding:6px}.seg button.on{background:var(--card);box-shadow:0 1px 3px #0002;font-weight:600}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut)}#status{margin-top:10px;min-height:18px}kbd{font:inherit;font-size:11px;padding:1px 5px;border:1px solid var(--bd);border-radius:4px}</style></head>
<body>
<h1><img src="icons/icon48.png" alt="">TabVault</h1><div class="mut" id="counts">Counting tabs…</div>
<div class="seg"><button data-scope="all">All windows</button><button data-scope="window">This window</button></div>
<button class="primary" id="go" style="width:100%;padding:12px">Save &amp; close tabs</button>
<div id="status"></div>
<div class="row"><button id="history">History</button><button id="timeline">Timeline</button><button id="folder">Folder</button></div>
<details><summary>Options</summary><div class="card" style="margin-top:8px">
<label><input type="checkbox" id="keepPinned"> Keep pinned tabs open</label>
<label><input type="checkbox" id="closeTabs"> Close tabs after saving</label>
<label><input type="checkbox" id="quietDownloads"> Hide the download pop-up while saving</label>
<label>Badge warning at <input type="number" id="badgeAt" min="0" max="999"> tabs</label>
<label><input type="checkbox" id="dailyOn"> Auto-archive daily at <input type="time" id="dailyTime"></label>
<div class="mut" style="margin-top:6px">Shortcuts: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>A</kbd> all tabs · <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>W</kbd> this window</div>
</div></details>
<script src="popup.js"></script></body></html>
