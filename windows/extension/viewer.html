<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TabVault – History</title>
<link rel="icon" href="icons/icon32.png"><link rel="stylesheet" href="style.css"><style>
body{font-size:14px}.wrap{display:grid;grid-template-columns:270px 1fr;gap:16px;max-width:1120px;margin:auto;padding:24px 16px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}h1{font-size:22px;margin:0 0 12px;display:flex;align-items:center;gap:10px}h1 img{width:28px}
#list button{display:block;width:100%;text-align:left;margin-bottom:6px}#list button.on{border-color:var(--ac);box-shadow:inset 3px 0 var(--ac)}
#search{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;margin-bottom:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}ol{padding-left:22px}li{margin:7px 0}li a{font-weight:600;text-decoration:none;color:var(--fg)}li a:hover{color:var(--ac)}
li small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}h3{margin:16px 0 4px;font-size:14px;color:var(--mut)}
.banner{background:color-mix(in srgb,var(--ok) 12%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);border-radius:10px;padding:10px 12px;margin-bottom:12px}
mark{background:color-mix(in srgb,var(--ac) 22%,transparent);color:inherit;border-radius:3px}
</style></head><body><div class="wrap">
<div><h1><img src="icons/icon48.png" alt="">TabVault</h1><input id="search" placeholder="Search all saved tabs…"><div id="list"></div>
<p class="mut" style="font-size:12px;margin-top:14px">Files are in <b>Downloads\TabVault</b>. Removing a session here never deletes files.</p></div>
<div class="card" id="detail"><p class="mut">No saved sessions yet. Click the TabVault button in the toolbar to save your first one.</p></div>
</div><script src="viewer.js"></script></body></html>
